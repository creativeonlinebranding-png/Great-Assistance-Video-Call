<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Great Assistance Video Call</title>

<script
src="https://8x8.vc/vpaas-magic-cookie-a59ba8eec5584ad48be64e6273bbbead/external_api.js"
async>
</script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111b21;
    color: white;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.header {
    height: 60px;
    background: #202c33;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.logo span {
    color: #25d366;
}

.status {
    color: #8696a0;
    font-size: 13px;
}

#jaas-container {
    flex: 1;
    width: 100%;
    min-height: 0;
}

.loading {
    position: absolute;
    inset: 60px 0 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111b21;
    color: #8696a0;
    z-index: 5;
}

.loadingBox {
    text-align: center;
}

.loadingIcon {
    font-size: 45px;
    margin-bottom: 15px;
}

.hidden {
    display: none;
}

</style>

</head>


<body>


<div id="app">


    <div class="header">

        <div class="logo">
            Great <span>Assistance</span>
        </div>

        <div
            id="status"
            class="status">
            Starting video call...
        </div>

    </div>


    <div
        id="jaas-container">
    </div>


    <div
        id="loading"
        class="loading">

        <div class="loadingBox">

            <div class="loadingIcon">
                📹
            </div>

            <div>
                Starting video call...
            </div>

        </div>

    </div>


</div>


<script>


/*
==================================================
GREAT ASSISTANCE — JAAS VIDEO CALL
==================================================
*/


const APP_ID =
"vpaas-magic-cookie-a59ba8eec5584ad48be64e6273bbbead";


/*
Create a unique room name.

For now we use the room supplied
by JaaS.

Later our Chat application can
generate a room name and send both
users into the same room.
*/


const ROOM_NAME =
"GreatAssistanceDemoRoom";


let api = null;


function startMeeting() {


    if (
        typeof JitsiMeetExternalAPI ===
        "undefined"
    ) {

        document.getElementById(
            "status"
        ).textContent =
        "Unable to load video service.";

        return;

    }


    try {


        api =
        new JitsiMeetExternalAPI(

            "8x8.vc",

            {

                roomName:
                APP_ID +
                "/" +
                ROOM_NAME,

                parentNode:
                document.getElementById(
                    "jaas-container"
                ),


                width:
                "100%",


                height:
                "100%",


                configOverwrite: {

                    prejoinPageEnabled:
                    true,

                    disableAP:
                    false

                },


                interfaceConfigOverwrite: {

                    TOOLBAR_BUTTONS: [

                        "microphone",

                        "camera",

                        "closedcaptions",

                        "desktop",

                        "fullscreen",

                        "fodeviceselection",

                        "hangup",

                        "profile",

                        "chat",

                        "settings",

                        "raisehand",

                        "videoquality"

                    ]

                }

            }

        );


        /*
        Meeting loaded.
        */


        api.addEventListener(
            "videoConferenceJoined",
            () => {

                document.getElementById(
                    "status"
                ).textContent =
                "Connected";

                document.getElementById(
                    "loading"
                ).classList.add(
                    "hidden"
                );

            }
        );


        api.addEventListener(
            "videoConferenceLeft",
            () => {

                document.getElementById(
                    "status"
                ).textContent =
                "Call ended";

            }
        );


        api.addEventListener(
            "readyToClose",
            () => {

                document.getElementById(
                    "status"
                ).textContent =
                "Call ended";

            }
        );


        /*
        If Jitsi loads but the joined
        event takes a moment, remove
        our loading screen after a few
        seconds.
        */


        setTimeout(
            () => {

                document.getElementById(
                    "loading"
                ).classList.add(
                    "hidden"
                );

            },
            5000
        );


    }

    catch (error) {

        console.error(
            "JaaS error:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
        "Video call error";


        document.getElementById(
            "loading"
        ).innerHTML = `

            <div class="loadingBox">

                <div class="loadingIcon">
                    ⚠️
                </div>

                <div>
                    Unable to start
                    video call.
                </div>

            </div>

        `;

    }

}


/*
Wait until the JaaS external API
has loaded.
*/


function waitForJaaS() {


    if (
        typeof JitsiMeetExternalAPI !==
        "undefined"
    ) {

        startMeeting();

        return;

    }


    setTimeout(
        waitForJaaS,
        200
    );

}


waitForJaaS();


</script>


</body>

</html>
