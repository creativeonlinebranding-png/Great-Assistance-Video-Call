<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Great Assistance Video Call</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    background: #000;

    color: #fff;

    font-family: Arial, sans-serif;

    overflow: hidden;

}


/* =========================
   VIDEOS
========================= */

#remoteVideo {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #111;

}


#localVideo {

    position: absolute;

    right: 15px;
    top: 15px;

    width: 120px;
    height: 170px;

    object-fit: cover;

    background: #222;

    border: 2px solid #fff;

    border-radius: 12px;

    z-index: 10;

}


/* =========================
   TOP INFO
========================= */

#info {

    position: absolute;

    top: 15px;
    left: 15px;

    z-index: 20;

    background: rgba(0,0,0,.65);

    padding: 12px 16px;

    border-radius: 10px;

}


#name {

    font-size: 18px;

    font-weight: bold;

}


#status {

    margin-top: 4px;

    color: #ccc;

    font-size: 13px;

}


/* =========================
   CONTROLS
========================= */

#controls {

    position: absolute;

    bottom: 30px;

    left: 0;
    right: 0;

    display: flex;

    justify-content: center;

    gap: 15px;

    z-index: 30;

}


.control {

    width: 58px;
    height: 58px;

    border: none;

    border-radius: 50%;

    background: #333;

    color: white;

    font-size: 21px;

}


.control:active {

    transform: scale(.95);

}


.end {

    background: #e53935;

}


/* =========================
   START SCREEN
========================= */

#startScreen {

    position: absolute;

    inset: 0;

    z-index: 100;

    background: #111b21;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 25px;

}


.startBox {

    max-width: 400px;

}


.startBox h1 {

    color: #25d366;

}


.startBox p {

    color: #aebac1;

    line-height: 1.5;

}


#startButton {

    border: none;

    padding: 15px 30px;

    border-radius: 10px;

    background: #25d366;

    color: #071b12;

    font-size: 16px;

    font-weight: bold;

}


/* =========================
   INCOMING CALL
========================= */

#incomingCall {

    position: absolute;

    inset: 0;

    z-index: 200;

    background:
    linear-gradient(
        rgba(0,0,0,.82),
        rgba(0,0,0,.92)
    );

    display: none;

    align-items: center;

    justify-content: center;

    text-align: center;

}


.incomingBox {

    width: 90%;

    max-width: 380px;

}


.incomingAvatar {

    width: 100px;
    height: 100px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #25d366;

    color: #071b12;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    font-weight: bold;

}


.incomingBox h2 {

    margin-bottom: 8px;

}


.incomingBox p {

    color: #aebac1;

}


.callActions {

    display: flex;

    justify-content: center;

    gap: 35px;

    margin-top: 30px;

}


.answerButton,
.declineButton {

    width: 65px;
    height: 65px;

    border: none;

    border-radius: 50%;

    color: white;

    font-size: 25px;

}


.answerButton {

    background: #25d366;

}


.declineButton {

    background: #e53935;

}


/* =========================
   ERROR
========================= */

#errorScreen {

    position: absolute;

    inset: 0;

    z-index: 300;

    background: #111b21;

    display: none;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 25px;

}


.errorBox {

    max-width: 400px;

}


.errorBox h2 {

    color: #ff5555;

}


.errorBox p {

    color: #aebac1;

    line-height: 1.5;

}


.retryButton {

    padding: 14px 25px;

    border: none;

    border-radius: 10px;

    background: #25d366;

    color: #071b12;

    font-weight: bold;

}

</style>

</head>


<body>


<!-- =========================
     REMOTE VIDEO
========================= -->

<video
id="remoteVideo"
autoplay
playsinline>
</video>


<!-- =========================
     LOCAL VIDEO
========================= -->

<video
id="localVideo"
autoplay
playsinline
muted>
</video>


<!-- =========================
     INFO
========================= -->

<div id="info">

    <div id="name">
        Great Assistance
    </div>

    <div id="status">
        Connecting...
    </div>

</div>


<!-- =========================
     CONTROLS
========================= -->

<div id="controls">

    <button
    id="muteButton"
    class="control">

        🎤

    </button>


    <button
    id="cameraButton"
    class="control">

        📷

    </button>


    <button
    id="endButton"
    class="control end">

        ☎

    </button>

</div>


<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

    <div class="startBox">

        <h1>
            Great Assistance
        </h1>

        <p id="startText">
            Preparing your video call...
        </p>

        <button
        id="startButton">

            Start Video Call

        </button>

    </div>

</div>


<!-- =========================
     INCOMING CALL
========================= -->

<div id="incomingCall">

    <div class="incomingBox">

        <div
        id="incomingAvatar"
        class="incomingAvatar">

            ?

        </div>


        <h2>
            Incoming Video Call
        </h2>


        <p
        id="incomingName">

            Someone is calling you

        </p>


        <div class="callActions">

            <button
            id="declineButton"
            class="declineButton">

                ☎

            </button>


            <button
            id="answerButton"
            class="answerButton">

                📹

            </button>

        </div>

    </div>

</div>


<!-- =========================
     ERROR
========================= -->

<div id="errorScreen">

    <div class="errorBox">

        <h2>
            Camera Error
        </h2>


        <p id="errorText">

            Camera and microphone could not be opened.

        </p>


        <button
        id="retryButton"
        class="retryButton">

            TRY AGAIN

        </button>

    </div>

</div>


<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getAuth,

    onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    getDatabase,

    ref,

    get,

    set,

    push,

    remove,

    onValue,

    onChildAdded

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyCrytf77WuZJthewnFLy5XL6i5Xh0vAW7o",

    authDomain:
    "great-assistance.firebaseapp.com",

    databaseURL:
    "https://great-assistance-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "great-assistance",

    storageBucket:
    "great-assistance.firebasestorage.app",

    messagingSenderId:
    "673899916289",

    appId:
    "1:673899916289:web:4c1f2b0845342309f62400"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const database =
getDatabase(app);


/* ==========================================
   ELEMENTS
========================================== */

const remoteVideo =
document.getElementById(
    "remoteVideo"
);


const localVideo =
document.getElementById(
    "localVideo"
);


const statusText =
document.getElementById(
    "status"
);


const nameText =
document.getElementById(
    "name"
);


const startScreen =
document.getElementById(
    "startScreen"
);


const startText =
document.getElementById(
    "startText"
);


const incomingCall =
document.getElementById(
    "incomingCall"
);


const incomingName =
document.getElementById(
    "incomingName"
);


const incomingAvatar =
document.getElementById(
    "incomingAvatar"
);


const errorScreen =
document.getElementById(
    "errorScreen"
);


const errorText =
document.getElementById(
    "errorText"
);


/* ==========================================
   VARIABLES
========================================== */

let currentUser = null;

let targetUserId = null;

let localStream = null;

let peerConnection = null;

let currentCallId = null;

let currentCallData = null;

let isCaller = false;

let answerListener = null;

let candidateListener = null;

let incomingCallListener = null;


/* ==========================================
   URL
========================================== */

const params =
new URLSearchParams(
    window.location.search
);


targetUserId =
params.get("user");


/* ==========================================
   WEBRTC
========================================== */

const rtcConfig = {

    iceServers: [

        {
            urls:
            "stun:stun.l.google.com:19302"
        },

        {
            urls:
            "stun:stun1.l.google.com:19302"
        }

    ]

};


/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            statusText.textContent =
            "Please log in first.";

            startScreen.style.display =
            "flex";

            startText.textContent =
            "Please log in to Great Assistance first.";

            document.getElementById(
                "startButton"
            ).style.display =
            "none";

            return;

        }


        currentUser = user;


        await loadCurrentUser();


        /*
        Start camera immediately.
        */

        await startCamera();


        /*
        If a user was passed in the URL,
        this is a call from the chat.
        */

        if (targetUserId) {

            isCaller = true;

            startScreen.style.display =
            "flex";

            startText.textContent =
            "Your camera is ready. Tap Start Video Call.";

            statusText.textContent =
            "Camera ready.";

        }

        else {

            /*
            No target means this page is
            waiting for an incoming call.
            */

            startScreen.style.display =
            "none";

            statusText.textContent =
            "Waiting for incoming call...";

            listenForIncomingCalls();

        }

    }

);


/* ==========================================
   CURRENT USER
========================================== */

async function loadCurrentUser() {

    try {

        const snapshot =
        await get(

            ref(
                database,
                "users/" +
                currentUser.uid
            )

        );


        const user =
        snapshot.val();


        if (user && user.name) {

            nameText.textContent =
            user.name;

        }

    }

    catch (error) {

        console.error(error);

    }

}


/* ==========================================
   CAMERA
========================================== */

async function startCamera() {

    try {

        statusText.textContent =
        "Requesting camera permission...";


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Camera API is not available in this browser."
            );

        }


        localStream =
        await navigator.mediaDevices.getUserMedia({

            video: true,

            audio: true

        });


        localVideo.srcObject =
        localStream;


        statusText.textContent =
        "Camera ready.";

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        errorText.textContent =
        error.name +
        " — " +
        error.message;


        errorScreen.style.display =
        "flex";


        statusText.textContent =
        "Camera permission denied.";

    }

}


/* ==========================================
   START CALL
========================================== */

document
.getElementById(
    "startButton"
)
.onclick = async () => {

    if (!targetUserId) {

        startScreen.style.display =
        "none";

        statusText.textContent =
        "Waiting for incoming call...";

        listenForIncomingCalls();

        return;

    }


    await createOutgoingCall();

};


/* ==========================================
   CREATE OUTGOING CALL
========================================== */

async function createOutgoingCall() {

    try {

        if (!localStream) {

            await startCamera();

        }


        if (!localStream) {

            return;

        }


        startScreen.style.display =
        "none";


        statusText.textContent =
        "Creating video call...";


        /*
        Get receiver information.
        */

        const receiverSnapshot =
        await get(

            ref(
                database,
                "users/" +
                targetUserId
            )

        );


        const receiver =
        receiverSnapshot.val();


        if (!receiver) {

            statusText.textContent =
            "User not found.";

            return;

        }


        nameText.textContent =
        receiver.name ||
        "Great Assistance User";


        /*
        Create peer connection.
        */

        peerConnection =
        createPeerConnection();


        /*
        Add local tracks.
        */

        localStream
        .getTracks()
        .forEach(track => {

            peerConnection.addTrack(
                track,
                localStream
            );

        });


        /*
        Create Firebase call.
        */

        const callRef =
        push(
            ref(
                database,
                "calls"
            )
        );


        currentCallId =
        callRef.key;


        /*
        ICE candidates.
        */

        peerConnection.onicecandidate =
        async event => {

            if (!event.candidate) {

                return;

            }


            await set(

                push(

                    ref(

                        database,

                        "calls/" +
                        currentCallId +
                        "/callerCandidates"

                    )

                ),

                event.candidate.toJSON()

            );

        };


        /*
        Create offer.
        */

        const offer =
        await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        /*
        Save call.
        */

        await set(

            callRef,

            {

                caller:
                currentUser.uid,

                callee:
                targetUserId,

                status:
                "ringing",

                offer: {

                    type:
                    offer.type,

                    sdp:
                    offer.sdp

                },

                createdAt:
                Date.now()

            }

        );


        statusText.textContent =
        "Calling...";


        /*
        Listen for answer.
        */

        listenForAnswer();


    }

    catch (error) {

        console.error(
            "Call creation error:",
            error
        );

        statusText.textContent =
        "Could not create call.";

    }

}


/* ==========================================
   PEER CONNECTION
========================================== */

function createPeerConnection() {

    const pc =
    new RTCPeerConnection(
        rtcConfig
    );


    /*
    Remote video.
    */

    pc.ontrack =
    event => {

        if (
            event.streams &&
            event.streams[0]
        ) {

            remoteVideo.srcObject =
            event.streams[0];


            statusText.textContent =
            "Connected 🎉";

        }

    };


    /*
    Connection state.
    */

    pc.onconnectionstatechange =
    () => {

        console.log(
            "Connection:",
            pc.connectionState
        );


        if (
            pc.connectionState ===
            "connected"
        ) {

            statusText.textContent =
            "Connected 🎉";

        }


        if (
            pc.connectionState ===
            "disconnected" ||
            pc.connectionState ===
            "failed" ||
            pc.connectionState ===
            "closed"
        ) {

            statusText.textContent =
            "Call disconnected.";

        }

    };


    return pc;

}


/* ==========================================
   LISTEN FOR ANSWER
========================================== */

function listenForAnswer() {

    if (!currentCallId) {

        return;

    }


    const callRef =
    ref(

        database,

        "calls/" +
        currentCallId

    );


    answerListener =
    onValue(

        callRef,

        async snapshot => {

            const call =
            snapshot.val();


            if (!call) {

                return;

            }


            /*
            Receiver accepted.
            */

            if (
                call.answer &&
                peerConnection &&
                !peerConnection.currentRemoteDescription
            ) {

                await peerConnection.setRemoteDescription(

                    new RTCSessionDescription(
                        call.answer
                    )

                );


                statusText.textContent =
                "Connected 🎉";


                listenForIceCandidates(

                    "calleeCandidates"

                );

            }


            /*
            Receiver declined.
            */

            if (
                call.status ===
                "declined"
            ) {

                statusText.textContent =
                "Call declined.";

                await cleanupCall();

            }

        }

    );

}


/* ==========================================
   INCOMING CALLS
========================================== */

function listenForIncomingCalls() {

    if (!currentUser) {

        return;

    }


    const callsRef =
    ref(
        database,
        "calls"
    );


    incomingCallListener =
    onChildAdded(

        callsRef,

        async snapshot => {

            const call =
            snapshot.val();


            if (!call) {

                return;

            }


            /*
            Only calls meant for this user.
            */

            if (
                call.callee !==
                currentUser.uid
            ) {

                return;

            }


            /*
            Ignore old calls.
            */

            if (
                Date.now() -
                (call.createdAt || 0)
                >
                120000
            ) {

                return;

            }


            /*
            Ignore calls that are no longer ringing.
            */

            if (
                call.status !==
                "ringing"
            ) {

                return;

            }


            currentCallId =
            snapshot.key;


            currentCallData =
            call;


            isCaller =
            false;


            /*
            Get caller information.
            */

            let callerName =
            "Great Assistance User";


            try {

                const callerSnapshot =
                await get(

                    ref(
                        database,
                        "users/" +
                        call.caller
                    )

                );


                const caller =
                callerSnapshot.val();


                if (
                    caller &&
                    caller.name
                ) {

                    callerName =
                    caller.name;

                }

            }

            catch (error) {

                console.error(error);

            }


            incomingName.textContent =
            callerName +
            " is calling you";


            incomingAvatar.textContent =
            callerName
            .charAt(0)
            .toUpperCase();


            incomingCall.style.display =
            "flex";


            statusText.textContent =
            "Incoming video call";

        }

    );

}


/* ==========================================
   ACCEPT CALL
========================================== */

document
.getElementById(
    "answerButton"
)
.onclick = async () => {

    try {

        incomingCall.style.display =
        "none";


        if (!currentCallId) {

            return;

        }


        if (!localStream) {

            await startCamera();

        }


        if (!localStream) {

            return;

        }


        statusText.textContent =
        "Answering call...";


        /*
        Create peer connection.
        */

        peerConnection =
        createPeerConnection();


        /*
        Add local tracks.
        */

        localStream
        .getTracks()
        .forEach(track => {

            peerConnection.addTrack(
                track,
                localStream
            );

        });


        /*
        ICE candidates.
        */

        peerConnection.onicecandidate =
        async event => {

            if (!event.candidate) {

                return;

            }


            await set(

                push(

                    ref(

                        database,

                        "calls/" +
                        currentCallId +
                        "/calleeCandidates"

                    )

                ),

                event.candidate.toJSON()

            );

        };


        /*
        Set caller offer.
        */

        await peerConnection.setRemoteDescription(

            new RTCSessionDescription(
                currentCallData.offer
            )

        );


        /*
        Create answer.
        */

        const answer =
        await peerConnection.createAnswer();


        await peerConnection.setLocalDescription(
            answer
        );


        /*
        Save answer.
        */

        await set(

            ref(

                database,

                "calls/" +
                currentCallId

            ),

            {

                ...currentCallData,

                status:
                "accepted",

                answer: {

                    type:
                    answer.type,

                    sdp:
                    answer.sdp

                }

            }

        );


        statusText.textContent =
        "Connecting...";


        /*
        Listen for caller ICE.
        */

        listenForIceCandidates(
            "callerCandidates"
        );

    }

    catch (error) {

        console.error(
            "Answer error:",
            error
        );


        statusText.textContent =
        "Could not answer call.";

    }

};


/* ==========================================
   DECLINE
========================================== */

document
.getElementById(
    "declineButton"
)
.onclick = async () => {

    try {

        if (currentCallId) {

            await set(

                ref(

                    database,

                    "calls/" +
                    currentCallId +
                    "/status"

                ),

                "declined"

            );

        }

    }

    catch (error) {

        console.error(error);

    }


    incomingCall.style.display =
    "none";


    statusText.textContent =
    "Call declined.";

};


/* ==========================================
   ICE CANDIDATES
========================================== */

function listenForIceCandidates(
    folder
) {

    if (!currentCallId) {

        return;

    }


    const candidatesRef =
    ref(

        database,

        "calls/" +
        currentCallId +
        "/" +
        folder

    );


    candidateListener =
    onValue(

        candidatesRef,

        async snapshot => {

            const candidates =
            snapshot.val() || {};


            for (
                const key
                in candidates
            ) {

                try {

                    await peerConnection.addIceCandidate(

                        new RTCIceCandidate(
                            candidates[key]
                        )

                    );

                }

                catch (error) {

                    console.error(
                        "ICE error:",
                        error
                    );

                }

            }

        }

    );

}


/* ==========================================
   MUTE
========================================== */

document
.getElementById(
    "muteButton"
)
.onclick = () => {

    if (!localStream) {

        return;

    }


    const track =
    localStream
    .getAudioTracks()[0];


    if (!track) {

        return;

    }


    track.enabled =
    !track.enabled;


    document
    .getElementById(
        "muteButton"
    )
    .textContent =
    track.enabled
    ? "🎤"
    : "🔇";

};


/* ==========================================
   CAMERA
========================================== */

document
.getElementById(
    "cameraButton"
)
.onclick = () => {

    if (!localStream) {

        return;

    }


    const track =
    localStream
    .getVideoTracks()[0];


    if (!track) {

        return;

    }


    track.enabled =
    !track.enabled;


    document
    .getElementById(
        "cameraButton"
    )
    .textContent =
    track.enabled
    ? "📷"
    : "🚫";

};


/* ==========================================
   END CALL
========================================== */

document
.getElementById(
    "endButton"
)
.onclick = async () => {

    await cleanupCall();


    window.history.back();

};


/* ==========================================
   CLEANUP
========================================== */

async function cleanupCall() {

    try {

        if (currentCallId) {

            await remove(

                ref(

                    database,

                    "calls/" +
                    currentCallId

                )

            );

        }

    }

    catch (error) {

        console.error(error);

    }


    if (peerConnection) {

        peerConnection.close();

        peerConnection = null;

    }


    if (localStream) {

        localStream
        .getTracks()
        .forEach(track => {

            track.stop();

        });

        localStream = null;

    }


    remoteVideo.srcObject =
    null;

    localVideo.srcObject =
    null;


    currentCallId =
    null;

    currentCallData =
    null;

}


/* ==========================================
   RETRY CAMERA
========================================== */

document
.getElementById(
    "retryButton"
)
.onclick = async () => {

    errorScreen.style.display =
    "none";

    await startCamera();

};


/* ==========================================
   PAGE CLOSE
========================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (localStream) {

            localStream
            .getTracks()
            .forEach(track => {

                track.stop();

            });

        }

        if (peerConnection) {

            peerConnection.close();

        }

    }
);

</script>

</body>
