<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Great Assistance Video Call</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:Arial,sans-serif;

background:#071015;

color:white;

height:100vh;

overflow:hidden;

}

#app{

height:100vh;

display:flex;

flex-direction:column;

}

.header{

height:60px;

background:#202c33;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 15px;

flex-shrink:0;

}

.logo{

font-size:20px;

font-weight:bold;

}

.logo span{

color:#25d366;

}

.status{

font-size:13px;

color:#8696a0;

}

.videoArea{

position:relative;

flex:1;

background:#000;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

}

#remoteVideo{

width:100%;

height:100%;

object-fit:cover;

background:#000;

}

#localVideo{

position:absolute;

right:15px;

top:15px;

width:125px;

height:175px;

object-fit:cover;

background:#202c33;

border-radius:12px;

border:2px solid #25d366;

z-index:5;

}

.waiting{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

text-align:center;

color:#8696a0;

z-index:2;

}

.waitingIcon{

font-size:55px;

margin-bottom:15px;

}

.controls{

height:85px;

background:#202c33;

display:flex;

align-items:center;

justify-content:center;

gap:15px;

flex-shrink:0;

}

.controlButton{

width:52px;

height:52px;

border:none;

border-radius:50%;

background:#2a3942;

color:white;

font-size:20px;

cursor:pointer;

}

.controlButton:hover{

background:#3b4a53;

}

.endButton{

width:58px;

height:58px;

border:none;

border-radius:50%;

background:#e53935;

color:white;

font-size:22px;

cursor:pointer;

}

#loginMessage{

position:absolute;

inset:0;

display:none;

align-items:center;

justify-content:center;

text-align:center;

padding:30px;

background:#071015;

z-index:100;

}

.messageBox{

max-width:400px;

background:#202c33;

padding:30px;

border-radius:18px;

}

.messageBox h2{

margin-top:0;

}

.messageBox p{

color:#8696a0;

line-height:1.5;

}

.messageBox button{

padding:13px 20px;

border:none;

border-radius:10px;

background:#25d366;

font-weight:bold;

cursor:pointer;

}

.hidden{

display:none!important;

}

@media(max-width:600px){

#localVideo{

width:105px;

height:145px;

right:10px;

top:10px;

}

}

</style>

</head>


<body>


<div id="app">


<div class="header">

<div class="logo">

Great <span>Assistance</span>

</div>

<div id="callStatus"
class="status">

Connecting...

</div>

</div>


<div class="videoArea">


<video
id="remoteVideo"
autoplay
playsinline>
</video>


<video
id="localVideo"
autoplay
muted
playsinline>
</video>


<div id="waiting"
class="waiting">

<div class="waitingIcon">
📹
</div>

<div id="waitingText">
Starting camera...
</div>

</div>

</div>


<div class="controls">

<button
id="muteButton"
class="controlButton"
title="Mute">

🎤

</button>


<button
id="cameraButton"
class="controlButton"
title="Camera">

📷

</button>


<button
id="endButton"
class="endButton"
title="End Call">

☎

</button>

</div>


</div>


<div id="loginMessage">

<div class="messageBox">

<h2>Video Call</h2>

<p id="errorText">
Please open this call from Great Assistance Chat.
</p>

<button
onclick="window.close()">

Close

</button>

</div>

</div>



<script type="module">


/* ============================================
   FIREBASE
============================================ */


import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getDatabase,
ref,
get,
set,
update,
onValue,
push,
onChildAdded,
onDisconnect,
remove

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

apiKey:
"AIzaSyCrytf77WuZJthewnFLy5XL6i5Xh0vAW7o",

authDomain:
"great-assistance.firebaseapp.com",

databaseURL:
"https://great-assistance-default-rtdb.europe-west1.firebasedatabase.app",

projectId:
"great-assistance",

storageBucket:
"great-assistance.firebasestorage.app",

messagingSenderId:
"673899916289",

appId:
"1:673899916289:web:4c1f2b0845342309f62400"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const database =
getDatabase(app);



/* ============================================
   URL
============================================ */


const params =
new URLSearchParams(
window.location.search
);

const callId =
params.get("callId");


/* ============================================
   ELEMENTS
============================================ */


const localVideo =
document.getElementById(
"localVideo"
);

const remoteVideo =
document.getElementById(
"remoteVideo"
);

const waiting =
document.getElementById(
"waiting"
);

const waitingText =
document.getElementById(
"waitingText"
);

const callStatus =
document.getElementById(
"callStatus"
);

const loginMessage =
document.getElementById(
"loginMessage"
);

const errorText =
document.getElementById(
"errorText"
);

const muteButton =
document.getElementById(
"muteButton"
);

const cameraButton =
document.getElementById(
"cameraButton"
);

const endButton =
document.getElementById(
"endButton"
);



/* ============================================
   VARIABLES
============================================ */


let currentUser = null;

let callData = null;

let peerConnection = null;

let localStream = null;

let callerCandidatesListener = null;

let calleeCandidatesListener = null;

let remoteDescriptionSet = false;

let ended = false;



/* ============================================
   WEBRTC SERVERS
============================================ */


const servers = {

iceServers:[

{
urls:[
"stun:stun.l.google.com:19302",
"stun:stun1.l.google.com:19302"
]
}

]

};



/* ============================================
   START
============================================ */


if(!callId){

showError(
"Invalid video call link. Please start the call from Great Assistance Chat."
);

}else{

onAuthStateChanged(
auth,
async user=>{

if(!user){

showError(
"Please log in through Great Assistance Chat first."
);

return;

}

currentUser = user;

await startCall();

}
);

}



/* ============================================
   ERROR
============================================ */


function showError(message){

loginMessage.style.display =
"flex";

errorText.textContent =
message;

}



/* ============================================
   GET CALL
============================================ */


async function startCall(){

try{

callStatus.textContent =
"Loading call...";


const callSnapshot =
await get(
ref(
database,
"calls/" + callId
)
);


if(!callSnapshot.exists()){

showError(
"This video call no longer exists."
);

return;

}


callData =
callSnapshot.val();


/*
Check that this user is
actually part of the call.
*/


const isCaller =
callData.caller ===
currentUser.uid;


const isCallee =
callData.callee ===
currentUser.uid;


if(!isCaller && !isCallee){

showError(
"You are not a participant in this call."
);

return;

}


/*
Prepare camera.
*/


await startCamera();


/*
Create WebRTC.
*/


createPeerConnection();


if(isCaller){

await callerStart();

}else{

await calleeStart();

}


/*
Watch call status.
*/


watchCall();


}catch(error){

console.error(error);

showError(
"Unable to start video call: " +
error.message
);

}

}



/* ============================================
   CAMERA
============================================ */


async function startCamera(){

waitingText.textContent =
"Requesting camera permission...";


try{

localStream =
await navigator.mediaDevices.getUserMedia({

video:true,

audio:true

});


localVideo.srcObject =
localStream;


waitingText.textContent =
"Camera ready";

callStatus.textContent =
"Camera ready";


setTimeout(
()=>{
waiting.classList.add("hidden");
},
800
);


}catch(error){

console.error(error);

throw new Error(
"Camera/microphone permission was denied."
);

}

}



/* ============================================
   PEER CONNECTION
============================================ */


function createPeerConnection(){

peerConnection =
new RTCPeerConnection(
servers
);


localStream
.getTracks()
.forEach(
track=>{

peerConnection.addTrack(
track,
localStream
);

}
);


/*
Remote video.
*/


peerConnection.ontrack =
event=>{

if(event.streams &&
event.streams[0]){

remoteVideo.srcObject =
event.streams[0];

waiting.classList.add(
"hidden"
);

callStatus.textContent =
"Connected";

}

};


/*
ICE candidate.
*/


peerConnection.onicecandidate =
async event=>{

if(!event.candidate){

return;

}


if(
callData.caller ===
currentUser.uid
){

await push(

ref(
database,
"calls/" +
callId +
"/callerCandidates"
),

event.candidate.toJSON()

);

}else{

await push(

ref(
database,
"calls/" +
callId +
"/calleeCandidates"
),

event.candidate.toJSON()

);

}

};


peerConnection.onconnectionstatechange =
()=>{

const state =
peerConnection.connectionState;


console.log(
"WebRTC state:",
state
);


if(state === "connected"){

callStatus.textContent =
"Connected";

waiting.classList.add(
"hidden"
);

}


if(
state === "disconnected" ||
state === "failed"
){

callStatus.textContent =
"Connection lost";

}


if(state === "closed"){

callStatus.textContent =
"Call ended";

}

};

}



/* ============================================
   CALLER
============================================ */


async function callerStart(){

callStatus.textContent =
"Calling...";

waitingText.textContent =
"Calling " +
(callData.calleeName ||
"User") +
"...";


const offer =
await peerConnection.createOffer();


await peerConnection.setLocalDescription(
offer
);


await update(

ref(
database,
"calls/" +
callId
),

{

offer:{
type:offer.type,
sdp:offer.sdp
},

status:
"calling"

}

);


/*
Listen for answer.
*/


onValue(

ref(
database,
"calls/" +
callId +
"/answer"
),

async snapshot=>{

if(
!snapshot.exists()
){

return;

}


if(
remoteDescriptionSet
){

return;

}


const answer =
snapshot.val();


await peerConnection.setRemoteDescription(

new RTCSessionDescription(
answer
)

);


remoteDescriptionSet =
true;

callStatus.textContent =
"Connecting...";

waitingText.textContent =
"Connecting to " +
(callData.calleeName ||
"User") +
"...";

}
);


/*
Listen for callee ICE.
*/


onChildAdded(

ref(
database,
"calls/" +
callId +
"/calleeCandidates"
),

async snapshot=>{

if(
!peerConnection
){

return;

}


try{

await peerConnection.addIceCandidate(

new RTCIceCandidate(
snapshot.val()
)

);

}catch(error){

console.error(
"ICE error:",
error
);

}

}
);

}



/* ============================================
   CALLEE
============================================ */


async function calleeStart(){

callStatus.textContent =
"Waiting for call";

waitingText.textContent =
"Connecting to " +
(callData.callerName ||
"caller") +
"...";


/*
Wait for caller offer.
*/


onValue(

ref(
database,
"calls/" +
callId +
"/offer"
),

async snapshot=>{

if(!snapshot.exists()){

return;

}


const offer =
snapshot.val();


if(
peerConnection.currentRemoteDescription
){

return;

}


try{

await peerConnection.setRemoteDescription(

new RTCSessionDescription(
offer
)

);


remoteDescriptionSet =
true;


/*
Create answer.
*/


const answer =
await peerConnection.createAnswer();


await peerConnection.setLocalDescription(
answer
);


await update(

ref(
database,
"calls/" +
callId
),

{

answer:{
type:answer.type,
sdp:answer.sdp
},

status:
"connected"

}

);


callStatus.textContent =
"Connecting...";


waitingText.textContent =
"Connecting to " +
(callData.callerName ||
"caller") +
"...";


}catch(error){

console.error(error);

callStatus.textContent =
"Connection error";

}

});


/*
Listen for caller ICE.
*/


onChildAdded(

ref(
database,
"calls/" +
callId +
"/callerCandidates"
),

async snapshot=>{

if(
!peerConnection
){

return;

}


try{

await peerConnection.addIceCandidate(

new RTCIceCandidate(
snapshot.val()
)

);

}catch(error){

console.error(
"ICE error:",
error
);

}

});

}



/* ============================================
   WATCH CALL
============================================ */


function watchCall(){

onValue(

ref(
database,
"calls/" +
callId +
"/status"
),

snapshot=>{

const status =
snapshot.val();


if(
status === "ringing"
){

callStatus.textContent =
"Calling...";

}


if(
status === "calling"
){

callStatus.textContent =
"Calling...";

}


if(
status === "connected"
){

callStatus.textContent =
"Connected";

}


if(
status === "ended"
){

endCall(false);

}

});

}



/* ============================================
   MUTE
============================================ */


muteButton.onclick =
()=>{

if(!localStream){

return;

}


const audioTracks =
localStream.getAudioTracks();


if(!audioTracks.length){

return;

}


audioTracks[0].enabled =
!audioTracks[0].enabled;


muteButton.textContent =
audioTracks[0].enabled
? "🎤"
: "🔇";

};



/* ============================================
   CAMERA
============================================ */


cameraButton.onclick =
()=>{

if(!localStream){

return;

}


const videoTracks =
localStream.getVideoTracks();


if(!videoTracks.length){

return;

}


videoTracks[0].enabled =
!videoTracks[0].enabled;


cameraButton.textContent =
videoTracks[0].enabled
? "📷"
: "🚫";

};



/* ============================================
   END CALL
============================================ */


endButton.onclick =
()=>{

endCall(true);

};



async function endCall(updateFirebase){

if(ended){

return;

}

ended =
true;


callStatus.textContent =
"Call ended";


/*
Stop camera.
*/


if(localStream){

localStream
.getTracks()
.forEach(
track=>{
track.stop();
}
);

}


/*
Close WebRTC.
*/


if(peerConnection){

peerConnection.close();

}


/*
Update Firebase.
*/


if(updateFirebase){

try{

await update(

ref(
database,
"calls/" +
callId
),

{

status:
"ended",

endedAt:
Date.now()

}

);

}catch(error){

console.error(error);

}

}


setTimeout(
()=>{

try{

window.close();

}catch(error){}

},
1000
);

}



</script>

</body>

</html>
